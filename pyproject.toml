[project]
name = "python-practice"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.142.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "scikit-learn>=1.9.1",
    "streamlit>=1.64.0",
    "uvicorn>=0.54.0",
]
[tool.pytest.ini_options]
minversion = "9.1"
testpaths = ["tests"]
addopts = ["-s", "-ra"]
markers = [
    "slow: marks tests as slow (deselect with \"-m 'not slow'\")",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
